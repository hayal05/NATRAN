[package]
name = "natra-management"
version = "1.2.0"
description = "Production offline-first inventory and cashflow management desktop application"
authors = ["NATRA Tech"]
edition = "2021"

[lib]
name = "inventory_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
turso = { version = "0.7.1", features = ["sync"] }

keyring = { version = "4", features = ["v1"] }
